name: Release

on:
  push:
    branches:
      - main

jobs:
  detect-packages:
    name: Detect changed packages
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_changes: ${{ steps.detect.outputs.has_changes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        name: Build release matrix
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.before }}"
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA=$(git rev-list --max-parents=0 HEAD)
          fi

          CHANGED=$(git diff --name-only "$BASE_SHA" "${{ github.sha }}" | awk -F/ '/^packages\/[^/]+\// { print $2 }' | sort -u)

          if [ -z "$CHANGED" ]; then
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo 'has_changes=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          JSON=$(printf '%s\n' "$CHANGED" | jq -R . | jq -cs '{include: map({package: ., workspace: ("@terra-graph-conventions/" + .)})}')
          echo "matrix=$JSON" >> "$GITHUB_OUTPUT"
          echo 'has_changes=true' >> "$GITHUB_OUTPUT"

  release:
    name: Release ${{ matrix.workspace }}
    runs-on: ubuntu-latest
    needs: detect-packages
    if: needs.detect-packages.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-packages.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone terra-graph sibling
        run: git clone --depth 1 https://github.com/kevbaldwyn/terra-graph.git ../terra-graph

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: 'https://registry.npmjs.org'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint:ci

      - name: Build
        run: yarn build

      - name: Test
        run: yarn test

      - name: Semantic release
        run: yarn workspace "${{ matrix.workspace }}" semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

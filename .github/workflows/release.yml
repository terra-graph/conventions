name: Release

on:
  push:
    branches:
      - main
      - rc/*
      
permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  detect-packages:
    name: Detect changed packages
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_changes: ${{ steps.detect.outputs.has_changes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        name: Build release matrix
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.before }}"
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA=$(git rev-list --max-parents=0 HEAD)
          fi

          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "${{ github.sha }}")
          if [ -z "$CHANGED_FILES" ] && git rev-parse HEAD~1 >/dev/null 2>&1; then
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          fi
          echo "Changed files:"
          printf '%s\n' "$CHANGED_FILES"
          CHANGED=$(printf '%s\n' "$CHANGED_FILES" | awk -F/ '/^packages\/[^/]+\// { print $2 }' | sort -u)
          GLOBAL_CHANGED=$(printf '%s\n' "$CHANGED_FILES" | awk -F/ '!/^packages\// { print }' | head -n 1)

          if [ -n "$GLOBAL_CHANGED" ]; then
            CHANGED=$(ls -1 packages | sort -u)
          fi

          if [ -z "$CHANGED" ]; then
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo 'has_changes=false' >> "$GITHUB_OUTPUT"
            echo 'has_core=false' >> "$GITHUB_OUTPUT"
            echo 'has_other=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CORE=$(printf '%s\n' "$CHANGED" | grep -x 'core' || true)
          NON_CORE=$(printf '%s\n' "$CHANGED" | grep -vx 'core' || true)
          ORDERED=$(printf '%s\n' "$CORE\n$NON_CORE" | sed '/^$/d')
          JSON=$(printf '%s\n' "$ORDERED" | jq -R . | jq -cs '{include: map({package: ., workspace: ("@terra-graph/conventions-" + .)})}')
          echo "matrix=$JSON" >> "$GITHUB_OUTPUT"

          echo 'has_changes=true' >> "$GITHUB_OUTPUT"

  release-packages:
    name: Release ${{ matrix.workspace }}
    runs-on: ubuntu-latest
    needs:
      - detect-packages
    if: needs.detect-packages.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.detect-packages.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync branch
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Configure npm auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN}" ]; then
            echo "NPM_TOKEN is missing in this job"
            exit 1
          fi
          TOKEN="$(printf '%s' "$NPM_TOKEN" | tr -d '\r\n')"
          CONFIG_PATH="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          {
            echo "registry=https://registry.npmjs.org/"
            echo "package-lock=false"
            echo "//registry.npmjs.org/:_authToken=${TOKEN}"
          } > "$CONFIG_PATH"

      - name: Lint
        run: yarn lint:ci

      - name: Build
        run: yarn workspace "${{ matrix.workspace }}" build

      - name: Test
        run: yarn workspace "${{ matrix.workspace }}" test

      - name: Semantic release
        run: ./node_modules/.bin/semantic-release -e ./packages/${{ matrix.package }}/.releaserc.cjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
          NPM_CONFIG_PACKAGE_LOCK: false
          NPM_CONFIG_PROVENANCE: true
